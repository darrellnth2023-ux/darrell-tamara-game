<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Darrell & Tamara's Quality Time Game</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #fff; text-align: center; margin: 0; padding: 10px; }
    h1 { color: #e94560; margin: 0 0 5px 0; font-size: 22px; }
    #turnBanner { font-size: 20px; font-weight: bold; margin-bottom: 5px; color: #f1c40f; }
    #timer { font-size: 22px; font-weight: bold; color: #e94560; margin-bottom: 10px; }
    .controls { display: flex; gap: 12px; justify-content: center; margin-bottom: 10px; }
    button { background: #e94560; color: #fff; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    button.secondary { background: #0f3460; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    #board { min-height: 380px; width: 95%; max-width: 1000px; border: 3px dashed #e94560; margin: 10px auto; border-radius: 12px; padding: 15px; background: rgba(255,255,255,0.03); display: flex; flex-wrap: wrap; gap: 15px; align-content: flex-start; justify-content: flex-start; overflow-x: auto; }
    .set-box { border: 2px solid #4ecca3; padding: 8px; border-radius: 8px; background: rgba(78, 204, 163, 0.05); display: flex; gap: 5px; align-items: center; min-width: 150px; min-height: 70px; }
    #rack { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; background: #16213e; padding: 12px; border-radius: 12px; max-width: 1000px; width: 95%; margin: 0 auto; min-height: 85px; border: 2px solid #0f3460; }

    /* All Tiles Have Solid White Background */
    .tile { width: 44px; height: 60px; background: #ffffff; font-weight: bold; font-size: 20px; border-radius: 6px; box-shadow: 0 3px 6px rgba(0,0,0,0.4); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; user-select: none; margin: 2px; text-align: center; color: #000; border: 1px solid #ccc; }
    .selected { outline: 3px solid #f1c40f; transform: translateY(-4px); }

    .red { color: #d62828; }
    .blue { color: #0077b6; }
    .black { color: #111; }
    .yellow { color: #f77f00; }

    /* Wildcard Design */
    .wild-container { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .wild-symbol { font-size: 22px; line-height: 1; }
    .wild-text { font-size: 8px; font-weight: 900; color: #000000; text-transform: uppercase; letter-spacing: 0.5px; line-height: 1; margin-top: 2px; }
  </style>
</head>
<body>
  <h1>Darrell & Tamara's Quality Time Game</h1>
  <div id="turnBanner">Connecting...</div>
  <div id="timer">⏱️ 60s</div>

  <div class="controls">
    <button id="btnDraw" onclick="drawTile()">Draw Tile (<span id="poolCount">0</span> left)</button>
    <button id="btnSubmit" onclick="submitTurn()">End Turn</button>
  </div>

  <h3>Main Playing Table</h3>
  <div id="board" onclick="handleBoardClick(event)"></div>

  <h3>Your Rack</h3>
  <div id="rack"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let myId = null;
    let selectedTile = null;
    let localTableSets = [];
    let localRack = [];
    let isMyTurn = false;

    let playerName = prompt("Enter your name:", "Darrell") || "Player";

    socket.on('connect', () => {
      myId = socket.id;
      socket.emit('joinGame', playerName);
    });

    socket.on('timerUpdate', (time) => {
      document.getElementById('timer').innerText = `⏱️ ${time}s`;
    });

    socket.on('errorMessage', (msg) => { alert(msg); });

    socket.on('gameUpdate', (data) => {
      document.getElementById('poolCount').innerText = data.poolCount;
      isMyTurn = data.activePlayerId === myId;

      const activePlayerObj = data.players[data.activePlayerId];
      const activeName = activePlayerObj ? activePlayerObj.name : "Player";

      const banner = document.getElementById('turnBanner');
      if (isMyTurn) {
        banner.innerText = `IT'S YOUR TURN (${activeName})!`;
      } else {
        banner.innerText = `${activeName}'s Turn...`;
      }
      
      document.getElementById('btnDraw').disabled = !isMyTurn;
      document.getElementById('btnSubmit').disabled = !isMyTurn;

      if (data.players[myId]) localRack = data.players[myId].rack;
      localTableSets = data.tableSets;

      renderAll();
    });

    function renderAll() {
      // Render Rack
      const rackEl = document.getElementById('rack');
      rackEl.innerHTML = '';
      localRack.forEach((tile, idx) => {
        const t = createTileElement(tile);
        if (selectedTile && selectedTile.source === 'rack' && selectedTile.tileIdx === idx) {
          t.classList.add('selected');
        }
        if (isMyTurn) t.onclick = (e) => {
          e.stopPropagation();
          selectRackTile(tile, idx);
        };
        rackEl.appendChild(t);
      });

      // Render Board
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      localTableSets.forEach((set, setIdx) => {
        const setDiv = document.createElement('div');
        setDiv.className = 'set-box';
        setDiv.onclick = (e) => {
          if (e.target === setDiv && selectedTile && isMyTurn) {
            e.stopPropagation();
            moveSelectedToSet(setIdx);
          }
        };

        set.forEach((tile, tileIdx) => {
          const t = createTileElement(tile);
          if (selectedTile && selectedTile.source === 'board' && selectedTile.setIdx === setIdx && selectedTile.tileIdx === tileIdx) {
            t.classList.add('selected');
          }
          if (isMyTurn) t.onclick = (e) => {
            e.stopPropagation();
            selectBoardTile(tile, setIdx, tileIdx);
          };
          setDiv.appendChild(t);
        });
        boardEl.appendChild(setDiv);
      });
    }

    function createTileElement(tile) {
      const t = document.createElement('div');
      t.className = 'tile';
      if (tile.joker) {
        t.innerHTML = `<div class="wild-container"><span class="wild-symbol">${tile.symbol}</span><span class="wild-text">WILD</span></div>`;
      } else {
        t.classList.add(tile.color);
        t.innerText = tile.num;
      }
      return t;
    }

    function selectRackTile(tile, idx) {
      if (selectedTile && selectedTile.source === 'board') {
        // PREVENT RETURNING WILD TILE TO RACK
        if (selectedTile.tile.joker) {
          alert("A Wild tile cannot be moved back to your rack once played! It must be moved directly to another set on the board.");
          selectedTile = null;
          renderAll();
          return;
        }

        // Return non-wild tile from board back to rack
        const [moved] = localTableSets[selectedTile.setIdx].splice(selectedTile.tileIdx, 1);
        if (localTableSets[selectedTile.setIdx].length === 0) localTableSets.splice(selectedTile.setIdx, 1);
        localRack.push(moved);
        selectedTile = null;
      } else {
        selectedTile = { tile, source: 'rack', tileIdx: idx };
      }
      renderAll();
    }

    function selectBoardTile(tile, setIdx, tileIdx) {
      if (selectedTile) {
        if (selectedTile.source === 'rack') {
          // Play tile from rack onto board
          localTableSets[setIdx].splice(tileIdx + 1, 0, selectedTile.tile);
          localRack.splice(selectedTile.tileIdx, 1);
          selectedTile = null;
        } else {
          // Move Wild or normal tile between sets on the board
          const [moved] = localTableSets[selectedTile.setIdx].splice(selectedTile.tileIdx, 1);
          if (localTableSets[selectedTile.setIdx].length === 0) localTableSets.splice(selectedTile.setIdx, 1);
          localTableSets[setIdx].splice(tileIdx, 0, moved);
          selectedTile = null;
        }
      } else {
        selectedTile = { tile, source: 'board', setIdx, tileIdx };
      }
      renderAll();
    }

    function handleBoardClick(e) {
      if (e.target.id === 'board' && selectedTile && isMyTurn) {
        if (selectedTile.source === 'rack') {
          const [moved] = localRack.splice(selectedTile.tileIdx, 1);
          localTableSets.push([moved]);
        } else {
          const [moved] = localTableSets[selectedTile.setIdx].splice(selectedTile.tileIdx, 1);
          if (localTableSets[selectedTile.setIdx].length === 0) localTableSets.splice(selectedTile.setIdx, 1);
          localTableSets.push([moved]);
        }
        selectedTile = null;
        renderAll();
      }
    }

    function moveSelectedToSet(setIdx) {
      if (selectedTile && selectedTile.source === 'rack') {
        const [moved] = localRack.splice(selectedTile.tileIdx, 1);
        localTableSets[setIdx].push(moved);
        selectedTile = null;
        renderAll();
      }
    }

    function drawTile() {
      selectedTile = null;
      socket.emit('drawTile');
    }

    function submitTurn() {
      selectedTile = null;
      socket.emit('submitTurn', { tableSets: localTableSets, rack: localRack });
    }
  </script>
</body>
</html>
